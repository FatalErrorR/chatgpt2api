apiVersion: v1
kind: Namespace
metadata:
  name: chatgpt2api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatgpt2api-data
  namespace: chatgpt2api
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatgpt2api
  namespace: chatgpt2api
  labels:
    app: chatgpt2api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatgpt2api
  template:
    metadata:
      labels:
        app: chatgpt2api
    spec:
      containers:
        - name: app
          image: ghcr.io/fatalerrorr/chatgpt2api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              hostPort: 3000
          env:
            - name: PORT
              value: "80"
            - name: STORAGE_BACKEND
              value: json
            - name: CHATGPT2API_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: chatgpt2api
                  key: auth-key
            - name: CHATGPT2API_BASE_URL
              value: https://yurencc2a.zeabur.app
            # 设置存到数据卷，后台改的配置（含图片放大开关）重启后保留
            - name: CHATGPT2API_CONFIG_FILE
              value: /app/data/config.json
            # 生图 Turnstile 由同一 Pod 里的 sentinel-solver 求解
            - name: CHATGPT2API_SENTINEL_SOLVER_URL
              value: http://127.0.0.1:8080
            - name: CHATGPT2API_SENTINEL_SOLVER_KEY
              valueFrom:
                secretKeyRef:
                  name: chatgpt2api
                  key: solver-key
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
        - name: sentinel-solver
          image: ghcr.io/fatalerrorr/chatgpt2api-sentinel-solver:latest
          imagePullPolicy: Always
          # 只给同 Pod 的主服务用，不经 Service 暴露
          ports:
            - name: solver
              containerPort: 8080
          env:
            - name: SENTINEL_SOLVER_KEY
              valueFrom:
                secretKeyRef:
                  name: chatgpt2api
                  key: solver-key
            - name: SENTINEL_SOLVER_TIMEZONE
              value: America/Los_Angeles
          volumeMounts:
            # 镜像不含 Chromium，启动时下载；放在数据卷里，重启不用重新下载
            - name: data
              mountPath: /ms-playwright
              subPath: ms-playwright
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            # 首次启动要下载 Chromium 和系统依赖
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chatgpt2api-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chatgpt2api
  namespace: chatgpt2api
spec:
  selector:
    app: chatgpt2api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatgpt2api
  namespace: chatgpt2api
spec:
  rules:
    - host: yurencc2a.zeabur.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatgpt2api
                port:
                  number: 80
    - host: c2a.129.226.215.74.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatgpt2api
                port:
                  number: 80
