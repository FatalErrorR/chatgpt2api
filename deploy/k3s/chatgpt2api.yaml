apiVersion: v1
kind: Namespace
metadata:
  name: chatgpt2api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatgpt2api-data
  namespace: chatgpt2api
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatgpt2api
  namespace: chatgpt2api
  labels:
    app: chatgpt2api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatgpt2api
  template:
    metadata:
      labels:
        app: chatgpt2api
    spec:
      containers:
        - name: app
          image: ghcr.io/basketikun/chatgpt2api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              hostPort: 3000
          env:
            - name: PORT
              value: "80"
            - name: STORAGE_BACKEND
              value: json
            - name: CHATGPT2API_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: chatgpt2api
                  key: auth-key
            - name: CHATGPT2API_BASE_URL
              value: http://129.226.215.74:3000
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chatgpt2api-data
---
apiVersion: v1
kind: Service
metadata:
  name: chatgpt2api
  namespace: chatgpt2api
spec:
  selector:
    app: chatgpt2api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatgpt2api
  namespace: chatgpt2api
spec:
  rules:
    - host: c2a.129.226.215.74.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatgpt2api
                port:
                  number: 80
